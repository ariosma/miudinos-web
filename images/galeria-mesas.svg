<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de las mesas de trabajo">
  <rect width="800" height="420" fill="#f5eddc"/>
  <rect y="420" width="800" height="180" fill="#d99a6c"/>
  <g stroke="#c98a5a" stroke-width="4">
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="220" y1="420" x2="220" y2="480"/><line x1="580" y1="420" x2="580" y2="480"/>
    <line x1="120" y1="480" x2="120" y2="540"/><line x1="440" y1="480" x2="440" y2="540"/><line x1="720" y1="480" x2="720" y2="540"/>
  </g>
  <!-- Ventana con luz -->
  <rect x="560" y="70" width="180" height="220" rx="12" fill="#fdf3d8" stroke="#d9b48c" stroke-width="8"/>
  <line x1="650" y1="78" x2="650" y2="282" stroke="#d9b48c" stroke-width="6"/>
  <line x1="568" y1="180" x2="732" y2="180" stroke="#d9b48c" stroke-width="6"/>
  <circle cx="610" cy="130" r="26" fill="#f2b950"/>
  <!-- Mesa grande -->
  <g>
    <ellipse cx="380" cy="540" rx="240" ry="22" fill="#b57b52" opacity=".45"/>
    <rect x="170" y="360" width="420" height="24" rx="10" fill="#d9b48c"/>
    <rect x="196" y="384" width="20" height="150" fill="#b98d68"/>
    <rect x="544" y="384" width="20" height="150" fill="#b98d68"/>
  </g>
  <!-- Bandeja con trasvase -->
  <g>
    <rect x="220" y="330" width="150" height="32" rx="8" fill="#e8cba4" stroke="#b98d68" stroke-width="4"/>
    <path d="M250 330 v-30 h40 v30" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
    <path d="M300 330 v-30 h40 v30" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
    <path d="M298 312 q20 -18 44 -8" stroke="#9db4c4" stroke-width="4" fill="none"/>
    <circle cx="326" cy="318" r="6" fill="#5e7d5b"/>
  </g>
  <!-- Jarra y vaso -->
  <g>
    <path d="M430 362 v-52 h34 v52 Z" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
    <path d="M464 322 q26 4 20 26 q-4 14 -20 12" fill="none" stroke="#9db4c4" stroke-width="5"/>
    <rect x="498" y="330" width="28" height="32" rx="4" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
  </g>
  <!-- Plantita en la mesa -->
  <g transform="translate(560 362)">
    <path d="M-16 0 h32 l-5 26 h-22 Z" fill="#c55a3b"/>
    <path d="M0 -2 q-14 -22 -28 -24 q10 18 24 24 q-2 -26 8 -38 q6 16 4 38 q14 -8 24 -24 q-14 2 -28 24" fill="#5e7d5b"/>
  </g>
  <!-- Sillas -->
  <g>
    <rect x="210" y="280" width="16" height="120" fill="#b98d68"/>
    <rect x="192" y="330" width="90" height="16" rx="7" fill="#d9b48c"/>
    <rect x="600" y="280" width="16" height="120" fill="#b98d68"/>
    <rect x="530" y="330" width="90" height="16" rx="7" fill="#d9b48c"/>
  </g>
  <!-- Estantería con materiales al fondo -->
  <g>
    <rect x="40" y="180" width="150" height="220" rx="10" fill="#d9b48c"/>
    <rect x="54" y="196" width="122" height="56" rx="6" fill="#f7efe0"/>
    <rect x="54" y="264" width="122" height="56" rx="6" fill="#f7efe0"/>
    <rect x="54" y="332" width="122" height="56" rx="6" fill="#f7efe0"/>
    <rect x="66" y="214" width="40" height="20" rx="4" fill="#e0704f"/>
    <rect x="116" y="210" width="48" height="24" rx="4" fill="#f2b950"/>
    <circle cx="90" cy="292" r="16" fill="#8ba888"/>
    <rect x="118" y="280" width="46" height="24" rx="4" fill="#f2c9bb"/>
    <rect x="66" y="348" width="34" height="28" rx="4" fill="#5e7d5b"/>
    <rect x="110" y="352" width="54" height="24" rx="4" fill="#b98d68"/>
  </g>
  <!-- Banderín pequeño -->
  <path d="M230 60 Q 400 110 570 56" fill="none" stroke="#d9b48c" stroke-width="4"/>
  <path d="M280 70 l18 30 18 -30 Z" fill="#e0704f"/>
  <path d="M350 82 l18 30 18 -30 Z" fill="#8ba888"/>
  <path d="M420 82 l18 30 18 -30 Z" fill="#f2b950"/>
  <path d="M490 68 l18 30 18 -30 Z" fill="#f2c9bb"/>
</svg>
