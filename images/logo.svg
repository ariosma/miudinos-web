<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logotipo de Miudiños: torre rosa Montessori con sol sonriente">
  <!-- Sol -->
  <circle cx="48" cy="13" r="7" fill="#f2b950"/>
  <g stroke="#f2b950" stroke-width="2.6" stroke-linecap="round">
    <line x1="48" y1="2.5" x2="48" y2="5"/>
    <line x1="58.5" y1="13" x2="56" y2="13"/>
    <line x1="55.4" y1="5.6" x2="53.6" y2="7.4"/>
    <line x1="40.6" y1="5.6" x2="42.4" y2="7.4"/>
  </g>
  <!-- Cara del sol -->
  <circle cx="45.6" cy="12" r="1.2" fill="#3d3429"/>
  <circle cx="50.4" cy="12" r="1.2" fill="#3d3429"/>
  <path d="M45.8 15 q2.2 2 4.4 0" stroke="#3d3429" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Torre rosa Montessori (5 cubos) -->
  <rect x="6"  y="50" width="40" height="10" rx="3.5" fill="#c55a3b"/>
  <rect x="10" y="41" width="32" height="9"  rx="3.5" fill="#e0704f"/>
  <rect x="14" y="33" width="24" height="8"  rx="3.5" fill="#e79e8f"/>
  <rect x="18" y="26" width="16" height="7"  rx="3"   fill="#f3b6aa"/>
  <rect x="22" y="20" width="8"  height="6"  rx="2.5" fill="#fbc6bc"/>
  <!-- Brillos -->
  <rect x="10" y="52" width="10" height="3" rx="1.5" fill="#fffdf8" opacity=".35"/>
  <rect x="14" y="43" width="8"  height="2.6" rx="1.3" fill="#fffdf8" opacity=".4"/>
  <!-- Hierba -->
  <path d="M4 60 q3 -5 6 0 M46 60 q3 -5 6 0" stroke="#8ba888" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
