<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de la zona de vida práctica y cuidado de plantas">
  <rect width="800" height="420" fill="#f5eddc"/>
  <rect y="420" width="800" height="180" fill="#d99a6c"/>
  <g stroke="#c98a5a" stroke-width="4">
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="240" y1="420" x2="240" y2="480"/><line x1="600" y1="420" x2="600" y2="480"/>
    <line x1="140" y1="480" x2="140" y2="540"/><line x1="460" y1="480" x2="460" y2="540"/><line x1="730" y1="480" x2="730" y2="540"/>
  </g>
  <!-- Cocinita de madera -->
  <g>
    <rect x="60" y="220" width="220" height="240" rx="12" fill="#d9b48c"/>
    <rect x="78" y="242" width="184" height="60" rx="8" fill="#f7efe0"/>
    <circle cx="120" cy="272" r="18" fill="#463a2d"/>
    <circle cx="180" cy="272" r="18" fill="#463a2d"/>
    <circle cx="120" cy="272" r="8" fill="#6f6353"/>
    <circle cx="180" cy="272" r="8" fill="#6f6353"/>
    <circle cx="228" cy="256" r="7" fill="#c55a3b"/>
    <circle cx="228" cy="288" r="7" fill="#f2b950"/>
    <!-- horno -->
    <rect x="78" y="320" width="184" height="120" rx="8" fill="#f7efe0"/>
    <rect x="92" y="336" width="156" height="70" rx="6" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
    <rect x="92" y="416" width="156" height="12" rx="6" fill="#b98d68"/>
    <!-- olla -->
    <rect x="120" y="196" width="70" height="30" rx="6" fill="#c55a3b"/>
    <rect x="112" y="200" width="12" height="10" rx="4" fill="#c55a3b"/>
    <rect x="186" y="200" width="12" height="10" rx="4" fill="#c55a3b"/>
    <path d="M132 196 q22 -16 46 0" fill="none" stroke="#6b4a2f" stroke-width="6"/>
    <path d="M150 176 q6 -12 0 -20 M166 178 q6 -12 0 -20" stroke="#c9c2b4" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Estantería con utensilios reales -->
  <g>
    <rect x="330" y="260" width="200" height="200" rx="10" fill="#d9b48c"/>
    <rect x="344" y="274" width="172" height="50" rx="6" fill="#f7efe0"/>
    <rect x="344" y="336" width="172" height="50" rx="6" fill="#f7efe0"/>
    <rect x="344" y="398" width="172" height="50" rx="6" fill="#f7efe0"/>
    <!-- jarrita -->
    <path d="M362 322 v-34 h24 v34 Z" fill="#dcebf5" stroke="#9db4c4" stroke-width="4"/>
    <path d="M386 296 q18 2 14 18 q-2 10 -14 8" fill="none" stroke="#9db4c4" stroke-width="4"/>
    <!-- vasos apilados -->
    <rect x="412" y="296" width="22" height="26" rx="3" fill="#f2c9bb"/>
    <rect x="440" y="296" width="22" height="26" rx="3" fill="#f2b950"/>
    <rect x="468" y="296" width="22" height="26" rx="3" fill="#8ba888"/>
    <!-- cuencos -->
    <path d="M356 372 h44 a22 12 0 0 1 -44 0 Z" fill="#e0704f"/>
    <path d="M412 372 h44 a22 12 0 0 1 -44 0 Z" fill="#5e7d5b"/>
    <path d="M468 372 h44 a22 12 0 0 1 -44 0 Z" fill="#f2b950"/>
    <!-- bandejas -->
    <rect x="356" y="420" width="70" height="14" rx="4" fill="#b98d68"/>
    <rect x="362" y="408" width="58" height="12" rx="4" fill="#e8cba4"/>
    <rect x="446" y="414" width="56" height="34" rx="5" fill="#8ba888"/>
  </g>
  <!-- Regadera -->
  <g transform="translate(590 380)">
    <path d="M0 40 v-56 h56 v56 Z" fill="#8ba888"/>
    <path d="M56 0 q30 -14 44 4 l-40 22" fill="#8ba888"/>
    <path d="M0 -4 q-16 4 -12 22 q2 10 12 12" fill="none" stroke="#5e7d5b" stroke-width="6"/>
    <circle cx="104" cy="8" r="8" fill="#5e7d5b"/>
    <path d="M108 16 q4 14 -2 22 M118 14 q8 12 4 24" stroke="#9db4c4" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Planta grande -->
  <g transform="translate(690 300)">
    <path d="M-10 120 q-4 -70 -34 -96 q30 8 40 42 q-2 -54 26 -80 q-8 40 0 74 q16 -34 44 -44 q-18 26 -24 56 q20 -14 38 -10 l-8 58 Z" fill="#5e7d5b"/>
    <path d="M-34 120 h78 l-10 80 h-58 Z" fill="#c55a3b"/>
    <ellipse cx="5" cy="205" rx="56" ry="10" fill="#b57b52" opacity=".5"/>
  </g>
  <!-- Delantal colgado -->
  <line x1="350" y1="70" x2="520" y2="70" stroke="#6b4a2f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="380" cy="70" r="6" fill="#6b4a2f"/>
  <path d="M362 76 h36 v24 h12 v60 h-60 v-60 h12 Z" fill="#f2c9bb"/>
  <circle cx="450" cy="70" r="6" fill="#6b4a2f"/>
  <path d="M436 76 h30 v20 h10 v52 h-50 v-52 h10 Z" fill="#8ba888"/>
