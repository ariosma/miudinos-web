<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de la biblioteca del arco">
  <rect width="800" height="600" fill="#8ba888"/>
  <rect width="800" height="600" fill="#93b090" opacity=".35"/>
  <!-- Suelo -->
  <rect y="470" width="800" height="130" fill="#d99a6c"/>
