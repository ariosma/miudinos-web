    <rect x="292" y="420" width="34" height="26" rx="4" fill="#e0704f"/>
    <rect x="334" y="414" width="34" height="32" rx="4" fill="#f2c9bb"/>
    <circle cx="408" cy="432" r="17" fill="#f2b950"/>
    <rect x="440" y="416" width="30" height="30" rx="4" fill="#8ba888"/>
    <rect x="478" y="412" width="30" height="34" rx="4" fill="#5e7d5b"/>
