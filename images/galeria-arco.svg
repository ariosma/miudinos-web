    <rect x="416" y="264" width="20" height="42" rx="3" fill="#c55a3b"/>
    <rect x="440" y="266" width="20" height="40" rx="3" fill="#f2b950" transform="rotate(5 440 266)"/>
    <rect x="470" y="272" width="40" height="30" rx="4" fill="#b98d68"/>
    <!-- libros fila 2 -->
    <rect x="292" y="336" width="20" height="40" rx="3" fill="#8ba888"/>
    <rect x="316" y="334" width="20" height="42" rx="3" fill="#f2c9bb"/>
    <rect x="340" y="338" width="20" height="38" rx="3" fill="#e0704f" transform="rotate(-5 340 338)"/>
    <rect x="368" y="342" width="52" height="30" rx="4" fill="#5e7d5b"/>
    <rect x="430" y="336" width="20" height="40" rx="3" fill="#f2b950"/>
    <rect x="454" y="334" width="20" height="42" rx="3" fill="#c55a3b"/>
    <rect x="478" y="338" width="20" height="38" rx="3" fill="#8ba888"/>
