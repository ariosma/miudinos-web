<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de los materiales sensoriales Montessori">
  <rect width="800" height="420" fill="#f5eddc"/>
  <rect y="420" width="800" height="180" fill="#d99a6c"/>
  <g stroke="#c98a5a" stroke-width="4">
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="200" y1="420" x2="200" y2="480"/><line x1="540" y1="420" x2="540" y2="480"/>
    <line x1="110" y1="480" x2="110" y2="540"/><line x1="400" y1="480" x2="400" y2="540"/><line x1="700" y1="480" x2="700" y2="540"/>
  </g>
  <!-- Alfombra de trabajo -->
  <rect x="60" y="430" width="680" height="110" rx="20" fill="#f2c9bb"/>
  <rect x="60" y="430" width="680" height="110" rx="20" fill="none" stroke="#e0a793" stroke-width="6"/>
  <!-- Torre rosa -->
  <g>
    <ellipse cx="220" cy="520" rx="130" ry="14" fill="#b57b52" opacity=".35"/>
    <rect x="140" y="430" width="160" height="90" rx="8" fill="#e79e8f"/>
    <rect x="152" y="368" width="136" height="62" rx="7" fill="#eba698"/>
    <rect x="164" y="316" width="112" height="52" rx="6" fill="#efaea1"/>
    <rect x="176" y="272" width="88" height="44" rx="6" fill="#f3b6aa"/>
    <rect x="188" y="236" width="64" height="36" rx="5" fill="#f7beb3"/>
    <rect x="200" y="206" width="40" height="30" rx="5" fill="#fbc6bc"/>
    <rect x="210" y="184" width="20" height="22" rx="4" fill="#ffcec5"/>
  </g>
  <!-- Escalera marrón -->
  <g transform="translate(430 500)">
    <rect x="0" y="-22" width="180" height="22" rx="5" fill="#a9764f"/>
    <rect x="20" y="-44" width="160" height="22" rx="5" fill="#b07e56"/>
    <rect x="40" y="-66" width="140" height="22" rx="5" fill="#b9875e"/>
    <rect x="60" y="-88" width="120" height="22" rx="5" fill="#c29066"/>
    <rect x="80" y="-110" width="100" height="22" rx="5" fill="#c9996e"/>
    <rect x="100" y="-132" width="80" height="22" rx="5" fill="#d0a176"/>
  </g>
  <!-- Cilindros con botón -->
  <g>
    <rect x="630" y="430" width="110" height="70" rx="8" fill="#d9b48c"/>
    <circle cx="657" cy="448" r="13" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="690" cy="448" r="11" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="720" cy="448" r="9" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="657" cy="480" r="9" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="690" cy="480" r="11" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="720" cy="480" r="13" fill="#f7efe0" stroke="#b98d68" stroke-width="4"/>
    <circle cx="657" cy="443" r="3" fill="#b98d68"/><circle cx="690" cy="444" r="3" fill="#b98d68"/><circle cx="720" cy="445" r="3" fill="#b98d68"/>
  </g>
  <!-- Cajas de colores en estantería -->
  <g>
    <rect x="80" y="120" width="200" height="180" rx="10" fill="#d9b48c"/>
    <rect x="94" y="136" width="172" height="64" rx="6" fill="#f7efe0"/>
    <rect x="94" y="212" width="172" height="72" rx="6" fill="#f7efe0"/>
    <rect x="104" y="150" width="30" height="36" rx="3" fill="#e0704f"/>
    <rect x="142" y="150" width="30" height="36" rx="3" fill="#f2b950"/>
    <rect x="180" y="150" width="30" height="36" rx="3" fill="#8ba888"/>
    <rect x="218" y="150" width="30" height="36" rx="3" fill="#9db4c4"/>
    <rect x="104" y="228" width="60" height="40" rx="4" fill="#f2c9bb"/>
    <rect x="176" y="228" width="72" height="40" rx="4" fill="#5e7d5b"/>
  </g>
  <!-- Cuentagotas y pompones sobre la alfombra -->
  <circle cx="380" cy="520" r="10" fill="#e0704f"/>
  <circle cx="404" cy="512" r="10" fill="#f2b950"/>
  <circle cx="392" cy="532" r="10" fill="#8ba888"/>
  <!-- Banderines -->
  <path d="M330 60 Q 520 110 700 60" fill="none" stroke="#d9b48c" stroke-width="4"/>
  <path d="M380 72 l18 30 18 -30 Z" fill="#e0704f"/>
  <path d="M450 84 l18 30 18 -30 Z" fill="#f2b950"/>
  <path d="M520 84 l18 30 18 -30 Z" fill="#8ba888"/>
  <path d="M590 72 l18 30 18 -30 Z" fill="#f2c9bb"/>
  <circle cx="700" cy="160" r="26" fill="#f2b950"/>
</svg>
