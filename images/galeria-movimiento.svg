<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de la zona de movimiento con Pikler">
  <rect width="800" height="420" fill="#f5eddc"/>
  <rect y="420" width="800" height="180" fill="#d99a6c"/>
  <g stroke="#c98a5a" stroke-width="4">
    <line x1="0" y1="480" x2="800" y2="480"/><line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="180" y1="420" x2="180" y2="480"/><line x1="560" y1="420" x2="560" y2="480"/>
    <line x1="90" y1="480" x2="90" y2="540"/><line x1="420" y1="480" x2="420" y2="540"/><line x1="720" y1="480" x2="720" y2="540"/>
  </g>
  <!-- Esterilla verde -->
  <rect x="90" y="400" width="620" height="130" rx="24" fill="#b7c9a4"/>
  <rect x="90" y="400" width="620" height="130" rx="24" fill="none" stroke="#9db48a" stroke-width="6"/>
  <line x1="300" y1="404" x2="300" y2="526" stroke="#9db48a" stroke-width="5"/>
  <line x1="510" y1="404" x2="510" y2="526" stroke="#9db48a" stroke-width="5"/>
  <!-- Triángulo Pikler -->
  <g>
    <path d="M150 470 L330 210 L510 470 Z" fill="none" stroke="#d9b48c" stroke-width="16" stroke-linejoin="round"/>
    <g stroke="#d9b48c" stroke-width="12" stroke-linecap="round">
      <line x1="195" y1="420" x2="465" y2="420"/>
      <line x1="217" y1="380" x2="443" y2="380"/>
      <line x1="239" y1="340" x2="421" y2="340"/>
      <line x1="261" y1="300" x2="399" y2="300"/>
      <line x1="283" y1="260" x2="377" y2="260"/>
    </g>
    <circle cx="330" cy="212" r="14" fill="#b98d68"/>
  </g>
  <!-- Rampa con topes -->
  <g transform="translate(430 470) rotate(-32)">
    <rect x="0" y="-14" width="220" height="28" rx="12" fill="#e8cba4" stroke="#b98d68" stroke-width="5"/>
    <g fill="#b98d68">
      <circle cx="35" cy="0" r="9"/><circle cx="75" cy="0" r="9"/><circle cx="115" cy="0" r="9"/><circle cx="155" cy="0" r="9"/><circle cx="195" cy="0" r="9"/>
    </g>
  </g>
  <!-- Arco de escalada -->
  <g transform="translate(600 470)">
    <path d="M-90 0 A90 90 0 0 1 90 0" fill="none" stroke="#d9b48c" stroke-width="16"/>
    <g stroke="#d9b48c" stroke-width="10" stroke-linecap="round">
      <line x1="-78" y1="-40" x2="-58" y2="-14"/>
      <line x1="-45" y1="-76" x2="-30" y2="-46"/>
      <line x1="0" y1="-90" x2="0" y2="-56"/>
      <line x1="45" y1="-76" x2="30" y2="-46"/>
      <line x1="78" y1="-40" x2="58" y2="-14"/>
    </g>
  </g>
  <!-- Pufs -->
  <ellipse cx="120" cy="520" rx="60" ry="30" fill="#8ba888"/>
  <ellipse cx="120" cy="510" rx="60" ry="28" fill="#9db48a"/>
  <ellipse cx="700" cy="300" rx="46" ry="46" fill="none" stroke="#d9b48c" stroke-width="6"/>
  <!-- Árbol de pared -->
  <g transform="translate(690 120)">
    <path d="M0 160 v-90 m0 30 q-30 -20 -34 -56 m34 40 q30 -24 30 -60" stroke="#b98d68" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g fill="#8ba888">
      <circle cx="-38" cy="38" r="17"/><circle cx="-20" cy="6" r="14"/><circle cx="34" cy="20" r="17"/><circle cx="16" cy="-14" r="15"/><circle cx="-6" cy="44" r="12"/>
    </g>
    <circle cx="52" cy="-8" r="9" fill="#e0704f"/>
  </g>
  <!-- Sol -->
  <circle cx="90" cy="90" r="30" fill="#f2b950"/>
</svg>
